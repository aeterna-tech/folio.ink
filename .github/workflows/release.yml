name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            ext: '.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            ext: ''
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            ext: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Установка Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка системных зависимостей (только Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Установка зависимостей фронта
        run: npm install

      - name: Установка зависимостей бэка
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Сборка PyInstaller бинарника
        run: |
          cd backend
          python -m PyInstaller --onefile --hidden-import=platformdirs run.py

      - name: Переименование sidecar под платформу (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Move-Item -Force backend/dist/run.exe src-tauri/binaries/run-${{ matrix.target }}${{ matrix.ext }}

      - name: Переименование sidecar под платформу (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          mv backend/dist/run src-tauri/binaries/run-${{ matrix.target }}

      - name: Сборка и публикация Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'folio.ink ${{ github.ref_name }}'
          releaseDraft: true